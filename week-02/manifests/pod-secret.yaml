apiVersion: v1
kind: Pod
metadata:
  name: secret-reader
spec:
  containers:
  - name: app
    image: busybox
    command:
    - sh
    - -c
    - |
      echo "=== From env vars ==="
      echo "DB_USER=$DB_USER"
      echo "DB_PASS=$DB_PASS"
      echo "=== From mounted files ==="
      echo "username: $(cat /etc/secrets/username)"
      echo "password: $(cat /etc/secrets/password)"
      sleep 3600
    env:
    - name: DB_USER
      valueFrom:
        secretKeyRef:
          name: db-credentials
          key: username
    - name: DB_PASS
      valueFrom:
        secretKeyRef:
          name: db-credentials
          key: password
    volumeMounts:
    - name: secret-vol
      mountPath: /etc/secrets
      readOnly: true
  volumes:
  - name: secret-vol
    secret:
      secretName: db-credentials
  restartPolicy: Never
