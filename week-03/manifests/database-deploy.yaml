apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
  namespace: tier-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      containers:
        - name: database
          image: redis:7
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: database
  namespace: tier-app
spec:
  selector:
    app: database
  ports:
    - port: 6379
      targetPort: 6379
