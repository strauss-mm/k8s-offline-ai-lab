apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: production
data:
  default.conf: |
    server {
      listen 8080;
      server_name localhost;

      location / {
        root /usr/share/nginx/html;
        index index.html;
      }

      location /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: production
data:
  default.conf: |
    server {
      listen 8080;
      server_name localhost;

      location / {
        return 200 '{"status":"ok","service":"api"}';
        add_header Content-Type application/json;
      }

      location /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
      }
    }
