apiVersion: apps/v1
kind: Deployment
metadata:
  name: probed-nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: probed-nginx
  template:
    metadata:
      labels:
        app: probed-nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 1
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 1
